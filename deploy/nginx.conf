# cocode 酷码工作室 · Cocode Studio VideoForge
# Replace studio.example.com and certificate paths with your own.
server {
    listen 80;
    server_name studio.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name studio.example.com;
    ssl_certificate /etc/letsencrypt/live/studio.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.example.com/privkey.pem;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:3088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
