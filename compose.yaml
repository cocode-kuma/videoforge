name: cocode-videoforge
services:
  studio:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      COOKIE_SECURE: "true"
      TRUST_PROXY_HOPS: "1"
    ports:
      - "127.0.0.1:3088:3088"
    volumes:
      - ./video_projects:/app/video_projects
      - ./logs:/app/logs
    shm_size: 1gb
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3088/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
